<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Актуальні оголошення — LogiFast</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
            background-color: #fafaf8; 
            color: #1e1e1e; 
            padding-bottom: 40px; 
        }
        
        /* Шапка сайту (як на скріншоті) */
        header { 
            background-color: #1a2a1f; 
            padding: 15px 40px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            color: #fff; 
        }
        .logo { font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 10px; letter-spacing: -0.5px; }
        .logo span { color: #4caf50; }
        nav a { 
            color: #ccc; 
            text-decoration: none; 
            margin-left: 25px; 
            font-size: 15px; 
            padding-bottom: 5px; 
            border-bottom: 2px solid transparent; 
            transition: 0.3s; 
        }
        nav a:hover, nav a.active { 
            color: #fff; 
            border-bottom-color: #4caf50; 
        }
        
        /* Контейнер */
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        h1 { font-size: 32px; margin-bottom: 10px; color: #1a2a1f; font-weight: 700; }
        .subtitle { color: #666; font-size: 15px; margin-bottom: 30px; }
        
        /* Фільтри */
        .controls { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 30px; align-items: center; }
        .filter-btn { 
            padding: 8px 18px; 
            border-radius: 30px; 
            border: 1px solid #ccc; 
            background: #fff; 
            cursor: pointer; 
            font-size: 14px; 
            font-weight: 500; 
            transition: 0.2s; 
            color: #333; 
        }
        .filter-btn.active { background-color: #2b7a5a; color: #fff; border-color: #2b7a5a; }
        .filter-btn:hover:not(.active) { border-color: #2b7a5a; color: #2b7a5a; }
        .search-input { 
            flex: 1; 
            min-width: 250px; 
            padding: 10px 18px; 
            border-radius: 30px; 
            border: 1px solid #ccc; 
            font-size: 14px; 
            outline: none; 
            background: #fff;
        }
        .search-input:focus { border-color: #2b7a5a; }
        
        /* Сітка карток */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 20px; }
        
        /* Картка (як на скріншоті) */
        .card { 
            background: #fff; 
            border-radius: 12px; 
            padding: 20px; 
            border: 1px solid #e0e5e0; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .card-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 15px; 
        }
        .badge { 
            font-size: 13px; 
            font-weight: 700; 
            text-transform: uppercase; 
            padding: 6px 12px; 
            border-radius: 6px; 
            letter-spacing: 0.5px;
        }
        .badge.export { background: #e8f5e9; color: #2b7a5a; }
        .badge.import { background: #e3f2fd; color: #1565c0; }
        .date { font-size: 13px; color: #888; }
        
        .card-body { flex: 1; }
        .info-row { display: flex; align-items: flex-start; margin-bottom: 10px; font-size: 14px; line-height: 1.5; color: #333; }
        .text { flex: 1; }
        
        /* Футер всередині картки */
        .card-footer-text {
            margin-top: 15px;
            padding-top: 10px;
            font-size: 13px;
            color: #555;
            border-top: 1px dashed #eee;
            line-height: 1.4;
        }
        
        /* Кнопка внизу картки */
        .card-footer { margin-top: 15px; text-align: right; }
        .btn-talk { 
            background-color: #2b7a5a; 
            color: #fff; 
            text-decoration: none; 
            padding: 10px 24px; 
            border-radius: 20px; 
            font-size: 14px; 
            font-weight: 600; 
            display: inline-block; 
            transition: 0.2s; 
        }
        .btn-talk:hover { background-color: #1f5f45; }
        
        /* Статуси */
        .loading, .no-results { text-align: center; padding: 50px; color: #666; grid-column: 1 / -1; font-size: 16px; }

        @media (max-width: 600px) {
            header { padding: 15px 20px; flex-direction: column; gap: 15px; }
            nav a { margin: 0 10px; }
            h1 { font-size: 26px; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Logi<span>Fast</span></div>
        <nav>
            <a href="#">Головна</a>
            <a href="#" class="active">Оголошення</a>
            <a href="https://t.me/logifast" target="_blank">Telegram</a>
        </nav>
    </header>

    <div class="container">
        <h1>Актуальні оголошення</h1>
        <p class="subtitle">Експорт та імпорт вантажів. Оновлюється щодня.</p>

        <div class="controls">
            <button class="filter-btn active" onclick="setFilter('all')">Всі</button>
            <button class="filter-btn" onclick="setFilter('Експорт')">Експорт</button>
            <button class="filter-btn" onclick="setFilter('Імпорт')">Імпорт</button>
            <input type="text" id="searchInput" class="search-input" placeholder="Пошук за країною, містом, вантажем..." oninput="renderCards()">
        </div>

        <div class="grid" id="cardsGrid">
            <div class="loading">⏳ Завантаження оголошень...</div>
        </div>
    </div>

    <script>
        // === НАЛАШТУВАННЯ ===
        const API_URL = 'https://script.google.com/macros/s/AKfycbyatAUQq657hCQdKnTMSutp7wMDV1D7jyBA8x0UdNna_znEEgaWWzbFLVk0mltWy5OB/exec';
        let allData = [];
        let currentFilter = 'all';

        // === ЗАВАНТАЖЕННЯ ДАНИХ ===
        async function fetchData() {
            try {
                // Обхід кешу Google
                const response = await fetch(API_URL + '?t=' + new Date().getTime());
                if (!response.ok) throw new Error('Network error');
                
                let data = await response.json();
                
                // Виправляємо пробіли в ключах
                allData = data.map(row => {
                    const normalized = {};
                    Object.keys(row).forEach(key => {
                        normalized[key.trim()] = row[key];
                    });
                    return normalized;
                });

                renderCards();
            } catch (error) {
                console.error('Помилка завантаження:', error);
                document.getElementById('cardsGrid').innerHTML = 
                    '<div class="no-results">❌ Не вдалося завантажити оголошення. Спробуйте пізніше.</div>';
            }
        }

        // === ФІЛЬТРАЦІЯ ===
        function setFilter(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.innerText === (type === 'all' ? 'Всі' : type)) {
                    btn.classList.add('active');
                }
            });
            renderCards();
        }

        // === ВІДОБРАЖЕННЯ КАРТОК ===
        function renderCards() {
            const grid = document.getElementById('cardsGrid');
            const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();

            let filtered = allData.filter(item => {
                if (currentFilter !== 'all' && item.тип !== currentFilter) return false;
                
                if (searchQuery) {
                    const searchString = `${item.країна} ${item['звідки']} ${item['куди']} ${item.авто} ${item.митниця}`.toLowerCase();
                    if (!searchString.includes(searchQuery)) return false;
                }
                return true;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="no-results">🔍 Нічого не знайдено за вашим запитом.</div>';
                return;
            }

            grid.innerHTML = filtered.map(item => {
                const isExport = item.тип === 'Експорт';
                const badgeClass = isExport ? 'export' : 'import';
                
                // Беремо дані як є (без очищення)
                const routeFrom = item['звідки'] || '';
                const routeTo = item['куди'] || '';
                const loading = item['завантаження'] || '';
                const cargo = item.вантаж || 'тнс';
                const auto = item.авто || '';
                const customs = item.митниця || '—';
                const payment = item['оплата'] || 'до обговорення';

                return `
                    <div class="card">
                        <div class="card-header">
                            <span class="badge ${badgeClass}">${item.тип} #${item.країна}</span>
                            <span class="date">${item.дата}</span>
                        </div>
                        <div class="card-body">
                            <div class="info-row">
                                <div class="text">🟢 #${item.країна}</div>
                            </div>
                            <div class="info-row">
                                <div class="text">📍 ${routeFrom} ➔ ${routeTo}</div>
                            </div>
                            <div class="info-row">
                                <div class="text">🗓 Завантаження: ${loading}</div>
                            </div>
                            <div class="info-row">
                                <div class="text">📦 Вантаж: ${cargo}</div>
                            </div>
                            <div class="info-row">
                                <div class="text">🚛 Авто: ${auto}</div>
                            </div>
                            <div class="info-row">
                                <div class="text">📑 Митниця: ${customs}</div>
                            </div>
                            <div class="info-row">
                                <div class="text">💵 Оплата: ${payment}</div>
                            </div>
                            
                            <!-- ТОЙ САМИЙ ФУТЕР, ЯКИЙ БУВ НА ПОЧАТКУ -->
                            <div class="card-footer-text">
                                📩 Пишіть в особисті повідомлення для обговорення ставки та деталей! @logifast
                            </div>
                        </div>
                        <div class="card-footer">
                            <a href="https://t.me/logifast" target="_blank" class="btn-talk">Обговорити</a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Запуск
        document.addEventListener('DOMContentLoaded', fetchData);
    </script>
</body>
</html>
