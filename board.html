<!DOCTYPE html>
<html lang="uk">
<head>
 <!-- Google Analytics -->

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Актуальні оголошення LogiFast — експорт та імпорт вантажів. Оновлюється щодня." />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <title>Оголошення — LogiFast</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Literata:opsz@7..72&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Literata', serif;
            background: #fafaf8;
            color: #1e1e1e;
            line-height: 1.6;
            padding-bottom: 80px;
        }
        a { text-decoration: none; color: inherit; }

        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 32px; position: sticky; top: 0; z-index: 1001;
            background-color: #1a2a1f; box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        .logo { display: flex; align-items: center; font-size: 22px; font-weight: 600; color: #fff; }
        .logo img { height: 38px; margin-right: 14px; border-radius: 6px; }
        .logo span { color: #8bc34a; }
        .nav-links { display: flex; gap: 20px; font-size: 13px; color: rgba(255,255,255,0.85); white-space: nowrap; overflow-x: auto; }
        .nav-links a { padding: 6px 0; border-bottom: 2px solid transparent; transition: border-color 0.25s; font-weight: 500; }
        .nav-links a:hover, .nav-links a.active { color: #fff; border-bottom-color: #8bc34a; }

        .container { max-width: 1400px; margin: 0 auto; padding: 40px 24px; }
        h1 { font-weight: 500; font-size: clamp(28px, 5vw, 40px); color: #1a2a1f; margin-bottom: 8px; }
        .subtitle { color: #5a6a5e; margin-bottom: 32px; font-size: 16px; }

        .controls { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 32px; }
        .filter-btn {
            padding: 10px 20px; border: 2px solid #2b7a5a; background: transparent;
            color: #2b7a5a; border-radius: 40px; cursor: pointer; font-family: inherit;
            font-size: 14px; font-weight: 600; transition: all 0.2s;
        }
        .filter-btn:hover, .filter-btn.active { background: #2b7a5a; color: #fff; }
        .search-input {
            flex: 1; min-width: 200px; padding: 10px 20px; border: 2px solid #e0e5e0;
            border-radius: 40px; font-family: inherit; font-size: 14px; outline: none;
            transition: border-color 0.2s;
        }
        .search-input:focus { border-color: #2b7a5a; }

        .board { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 24px; }

        .card {
            background: #fff; border-radius: 18px; padding: 22px 26px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.06);
            border-left: 4px solid #2b7a5a;
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 16px 48px rgba(43,122,90,0.12); }
        .card.import { border-left-color: #1976d2; }

        .card-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 14px; gap: 12px; flex-wrap: wrap;
        }
        .badge {
            display: inline-block; padding: 4px 14px; border-radius: 20px;
            font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .badge.export { background: #e8f5e9; color: #2b7a5a; }
        .badge.import { background: #e3f2fd; color: #1976d2; }
        .card-date { font-size: 12px; color: #999; }

        .announcement-text {
            font-size: 14.5px;
            line-height: 1.65;
            color: #1e1e1e;
            white-space: pre-line;
            word-wrap: break-word;
            overflow-wrap: break-word;
            margin-bottom: 16px;
            flex: 1;
        }

        .card-footer {
            padding-top: 14px; border-top: 1px solid #eef2ee;
            display: flex; justify-content: flex-end;
        }
        .contact-btn {
            padding: 9px 22px; background: #2b7a5a; color: #fff;
            border-radius: 30px; font-size: 13px; font-weight: 600;
            transition: background 0.2s, transform 0.2s;
        }
        .contact-btn:hover { background: #1f5f45; transform: scale(1.03); }

        .loading, .error, .empty {
            text-align: center; padding: 60px 20px; color: #5a6a5e;
            font-size: 16px; grid-column: 1 / -1;
        }
        .error { color: #c62828; }

        @media (max-width: 480px) {
            .navbar { padding: 8px 14px; }
            .logo { font-size: 15px; }
            .logo img { height: 24px; margin-right: 8px; }
            .nav-links { gap: 10px; font-size: 10.5px; }
            .container { padding: 24px 16px; }
            .board { grid-template-columns: 1fr; }
            .card { padding: 18px 18px; }
            .announcement-text { font-size: 13.5px; }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <a href="/" class="logo">
            <img src="logo.webp" alt="LogiFast logo" />
            Logi<span>Fast</span>
        </a>
        <nav class="nav-links">
            <a href="/">Головна</a>
            <a href="board.html" class="active">Оголошення</a>
            <a href="https://t.me/logifast" target="_blank">Telegram</a>
        </nav>
    </header>

    <main class="container">
        <h1>Актуальні оголошення</h1>
        <p class="subtitle">Експорт та імпорт вантажів. Оновлюється щодня.</p>

        <div class="controls">
            <button class="filter-btn active" data-filter="all">Всі</button>
            <button class="filter-btn" data-filter="Експорт">Експорт</button>
            <button class="filter-btn" data-filter="Імпорт">Імпорт</button>
            <input type="text" class="search-input" id="search" placeholder="Пошук за країною, містом, вантажем..." />
        </div>

        <div class="board" id="board">
            <p class="loading">Завантаження оголошень...</p>
        </div>
    </main>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbyatAUQq657hCQdKnTMSutp7wMDV1D7jyBA8x0UdNna_znEEgaWWzbFLVk0mltWy5OB/exec';

        let allAnnouncements = [];
        let currentFilter = 'all';
        let currentSearch = '';

        function clean(obj) {
            const out = {};
            Object.keys(obj).forEach(k => {
                const key = String(k).trim();
                let v = obj[k];
                if (typeof v === 'string') v = v.trim();
                out[key] = v;
            });
            return out;
        }

        // Визначаємо, чи це зернова культура
        function isGrain(text) {
            return /зерн|зерно|ріпак|шрот|соя|сою|горох|пшениц|кукурудз|ячмін|макух|соняшник|овес|жито|просо|люцерн|біг[\s-]?бег|big[\s-]?bag/i.test(text || '');
        }

        // Перетворює Вантаж і прибирає Оплату в готовому тексті
        function transformText(text) {
            if (!text) return '';
            const lines = text.split('\n');
            const out = [];
            for (let line of lines) {
                if (/💵/.test(line)) continue;
                if (/📦/.test(line)) {
                    out.push(isGrain(line) ? '📦 Вантаж: Зерно в біг-бегах' : '📦 Вантаж: ТНС');
                    continue;
                }
                out.push(line);
            }
            return out.join('\n');
        }

        // Збирає текст із розкиданих полів (стара структура таблиці)
        function buildTextFromFields(a) {
            const parts = [];
            if (a['країна']) parts.push('🟢 #' + a['країна']);
            if (a['звідки'] || a['куди']) {
                parts.push('📍 ' + (a['звідки'] || '') + ' ➔ ' + (a['куди'] || ''));
            }
            if (a['завантаження']) parts.push('🗓 Завантаження: ' + a['завантаження']);

            // Вантаж — завжди перевизначаємо
            parts.push(isGrain(a['вантаж']) ? '📦 Вантаж: Зерно в біг-бегах' : '📦 Вантаж: ТНС');

            if (a['авто']) parts.push('🚛 Авто: ' + a['авто']);
            if (a['митниця']) parts.push('📑 Митниця: ' + a['митниця']);
            // Оплату НЕ додаємо
            parts.push('📩 Пишіть в особисті повідомлення для обговорення ставки та деталей! @logifast');
            return parts.join('\n');
        }

        // Універсальна: якщо є поле «текст» — використовуємо його, інакше збираємо з полів
        function getAnnouncementText(a) {
            if (a['текст'] && String(a['текст']).trim().length > 0) {
                return transformText(a['текст']);
            }
            return buildTextFromFields(a);
        }

        async function loadAnnouncements() {
            const board = document.getElementById('board');
            try {
                const response = await fetch(API_URL + '?t=' + Date.now());
                if (!response.ok) throw new Error('Network error');
                const rawData = await response.json();
                allAnnouncements = rawData.map(clean);
                renderAnnouncements();
            } catch (error) {
                board.innerHTML = '<p class="error">Не вдалося завантажити оголошення. Спробуйте оновити сторінку пізніше.</p>';
                console.error(error);
            }
        }

        function renderAnnouncements() {
            const board = document.getElementById('board');
            let filtered = allAnnouncements;

            if (currentFilter !== 'all') {
                filtered = filtered.filter(a => a['тип'] === currentFilter);
            }
            if (currentSearch) {
                const q = currentSearch.toLowerCase();
                filtered = filtered.filter(a =>
                    Object.values(a).some(v => String(v).toLowerCase().includes(q))
                );
            }

            if (filtered.length === 0) {
                board.innerHTML = '<p class="empty">Наразі немає активних оголошень за цим фільтром.</p>';
                return;
            }

            board.innerHTML = filtered.map(a => {
                const isImport = a['тип'] === 'Імпорт';
                const badgeClass = isImport ? 'import' : 'export';
                const cardClass = isImport ? 'card import' : 'card';
                const country = a['країна'] ? ' #' + a['країна'] : '';
                const text = getAnnouncementText(a);

                return `
                    <div class="${cardClass}">
                        <div class="card-header">
                            <span class="badge ${badgeClass}">${a['тип'] || ''}${country}</span>
                            <span class="card-date">${a['дата'] || ''}</span>
                        </div>
                        <div class="announcement-text">${escapeHtml(text)}</div>
                        <div class="card-footer">
                            <a href="https://t.me/logifast" target="_blank" class="contact-btn">Обговорити</a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderAnnouncements();
            });
        });

        document.getElementById('search').addEventListener('input', (e) => {
            currentSearch = e.target.value;
            renderAnnouncements();
        });

        loadAnnouncements();
    </script>
</body>
</html>
